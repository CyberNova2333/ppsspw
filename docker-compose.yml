# Build make pages first. Only the packaged player is exposed.
services:
  player:
    image: python:3.13-slim
    working_dir: /app
    command: ["python3", "server/serve-player.py", "--bind", "0.0.0.0", "--port", "17881"]
    ports:
      - "127.0.0.1:17881:17881"
    volumes:
      - ./server/serve-player.py:/app/server/serve-player.py:ro
      - ./wasm-page/dist/ppsspp-web:/app/wasm-page/dist/ppsspp-web:ro
    init: true
