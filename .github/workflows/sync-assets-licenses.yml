name: 核对 ASSETS_LICENSES

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets-licenses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-assets-licenses:
    name: 核对 ASSETS_LICENSES.md
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出完整历史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 检查贡献者清单
        run: python3 .github/scripts/sync_assets_licenses.py github --check
