name: 构建并部署网页客户端

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅在容器内执行测试与全量构建校验，跳过直传 EdgeOne 与线上验活'
        required: false
        type: boolean
        default: false
      verify_live:
        description: '部署后请求线上地址验证构建版本与浏览器隔离响应头'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: portable-player-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 构建固定工具链镜像（启用 GHA 层缓存）
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: scripts/ci/Dockerfile
          target: toolchain
          tags: ppsspw-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 测试并完整构建
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace ppsspw-ci bash scripts/ci/build.sh
      - name: 直传 EdgeOne Makers
        if: ${{ !inputs.dry_run }}
        env:
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || secrets.EDGEONE_PROJECT_NAME }}
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
        run: pnpm dlx --yes edgeone makers deploy wasm-page/dist/ppsspp-web -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_PAGES_API_TOKEN"
      - name: 验证线上版本与浏览器隔离响应头
        if: ${{ !inputs.dry_run && inputs.verify_live }}
        env:
          PLAYER_PUBLIC_ORIGIN: ${{ vars.PLAYER_PUBLIC_ORIGIN || secrets.PLAYER_PUBLIC_ORIGIN }}
        run: node scripts/ci/verify-deployment.mjs
