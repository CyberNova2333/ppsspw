name: 构建并部署网页客户端

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-player-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 构建固定工具链镜像
        run: docker build --target toolchain -t ppsspw-ci -f .cnb/Dockerfile .
      - name: 测试并完整构建
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace ppsspw-ci bash scripts/ci/build.sh
      - name: 直传 EdgeOne Makers
        env:
          EDGEONE_PROJECT_NAME: ${{ secrets.EDGEONE_PROJECT_NAME }}
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
        run: npx --yes edgeone makers deploy wasm-page/dist/ppsspp-web -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_PAGES_API_TOKEN"
      - name: 验证线上版本与浏览器隔离响应头
        env:
          PLAYER_PUBLIC_ORIGIN: ${{ secrets.PLAYER_PUBLIC_ORIGIN }}
        run: node scripts/ci/verify-deployment.mjs
