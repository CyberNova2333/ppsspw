name: 源码测试与完整构建

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_scope:
        description: '构建与测试范围（full 全量构建 / tests-only 仅运行前端与单元测试，跳过耗时 Wasm 全编）'
        required: false
        type: choice
        default: 'full'
        options:
          - 'full'
          - 'tests-only'

permissions:
  contents: read

concurrency:
  group: source-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 构建固定工具链镜像（启用 GHA 层缓存）
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: scripts/ci/Dockerfile
          target: toolchain
          tags: ppsspw-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 测试并按范围构建
        env:
          BUILD_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_scope || 'full' }}
        run: |
          if [ "$BUILD_SCOPE" = "tests-only" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace ppsspw-ci bash -lc '
              set -euo pipefail
              pnpm --dir wasm-page install --frozen-lockfile
              pnpm --dir wasm-page test
              python3 -m unittest discover -s server/player-tests -v
              node --test scripts/ci/prepare-deploy.test.mjs
              node --test scripts/scene-input-scheduler.test.mjs
              node --test scripts/browser-scene-session.test.mjs
              python3 scripts/test-sdl-viewport.py
              python3 scripts/test-tabbed-layout.py
            '
          else
            docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace ppsspw-ci bash scripts/ci/build.sh
          fi
